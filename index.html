<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reflect – You Are Worth It</title>

  <style>
    /* ─── RESET ─────────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ─── TOKENS ─────────────────────────────────────────── */
    :root {
      --teal-dark   : #1a6b8a;
      --teal-mid    : #1d9ac4;
      --teal-light  : #4bbde8;
      --cyan        : #3bbfdc;
      --bg          : #f4f9fc;
      --white       : #ffffff;
      --text-dark   : #1a2e38;
      --text-mid    : #3a5a6a;
      --text-soft   : #7ca8bb;
      --shadow-btn  : 0 6px 28px rgba(29, 154, 196, 0.30);
    }

    /* ─── BASE ───────────────────────────────────────────── */
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text-dark);
      -webkit-font-smoothing: antialiased;
    }

    /* ─── BACKGROUND ─────────────────────────────────────── */
    .bg-gradient {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: linear-gradient(150deg, #dff1fa 0%, #f4f9fc 50%, #cce8f5 100%);
    }

    .bg-dots {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image: radial-gradient(
        circle,
        rgba(29, 154, 196, 0.10) 1px,
        transparent 1px
      );
      background-size: 42px 42px;
    }

    /* Ambient orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(72px);
      opacity: 0.38;
      pointer-events: none;
      z-index: 0;
      animation: drift linear infinite;
    }
    .orb-1 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, #4bbde8, #1d9ac4);
      top: -180px; left: -140px;
      animation-duration: 24s;
    }
    .orb-2 {
      width: 360px; height: 360px;
      background: radial-gradient(circle, #00c6e0, #1a6b8a);
      bottom: -110px; right: -90px;
      animation-duration: 30s;
      animation-direction: reverse;
    }
    .orb-3 {
      width: 200px; height: 200px;
      background: radial-gradient(circle, #9ee8f5, #4bbde8);
      top: 42%; left: 62%;
      animation-duration: 19s;
    }

    @keyframes drift {
      0%   { transform: translate(0,   0)   scale(1);    }
      33%  { transform: translate(28px,-18px) scale(1.04); }
      66%  { transform: translate(-18px,26px) scale(0.97); }
      100% { transform: translate(0,   0)   scale(1);    }
    }

    /* Mirror centre line */
    .mirror-line {
      position: fixed;
      top: 0; left: 50%;
      width: 1px; height: 100%;
      background: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(29,154,196,0.18) 28%,
        rgba(29,154,196,0.18) 72%,
        transparent 100%
      );
      z-index: 0;
      pointer-events: none;
    }

    /* Pulse rings */
    .pulse-ring {
      position: fixed;
      border: 1px solid rgba(29, 154, 196, 0.13);
      border-radius: 50%;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 1;
      animation: ringPulse 3.8s ease-out infinite;
    }
    .pulse-ring:nth-child(1) { width: 420px; height: 420px; animation-delay: 0s;    }
    .pulse-ring:nth-child(2) { width: 600px; height: 600px; animation-delay: 1.2s;  }
    .pulse-ring:nth-child(3) { width: 780px; height: 780px; animation-delay: 2.4s;  }

    @keyframes ringPulse {
      0%   { opacity: 0.55; transform: translate(-50%,-50%) scale(0.90); }
      70%  { opacity: 0;    transform: translate(-50%,-50%) scale(1.06); }
      100% { opacity: 0;    transform: translate(-50%,-50%) scale(1.06); }
    }

    /* ─── MAIN STAGE ─────────────────────────────────────── */
    .stage {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      gap: 0;
    }

    /* ─── LOGO ───────────────────────────────────────────── */
    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 32px;
      animation: logoReveal 1.1s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes logoReveal {
      from { opacity: 0; transform: translateY(-24px) scale(0.93); }
      to   { opacity: 1; transform: translateY(0)      scale(1);    }
    }

    .logo-img {
      width: 148px;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 6px 20px rgba(29, 154, 196, 0.20));
      user-select: none;
      -webkit-user-drag: none;
    }

    /* ─── HEADLINE ROTATOR ───────────────────────────────── */
    .headline-wrap {
      position: relative;
      height: 100px;
      width: 100%;
      max-width: 700px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .headline {
      position: absolute;
      width: 100%;
      padding: 0 20px;
      font-size: clamp(24px, 4vw, 44px);
      font-weight: 700;
      letter-spacing: -0.4px;
      color: var(--teal-dark);
      text-align: center;
      line-height: 1.2;
      white-space: pre-line;
      opacity: 0;
      transform: translateY(30px);
      will-change: opacity, transform;
    }

    .headline.enter {
      animation: hIn  0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .headline.leave {
      animation: hOut 0.50s cubic-bezier(0.55, 0, 0.78, 0) forwards;
    }

    @keyframes hIn {
      from { opacity: 0; transform: translateY(30px)  scale(0.97); }
      to   { opacity: 1; transform: translateY(0)      scale(1);    }
    }
    @keyframes hOut {
      from { opacity: 1; transform: translateY(0)      scale(1);    }
      to   { opacity: 0; transform: translateY(-30px)  scale(0.97); }
    }

    /* ─── SUBLINE ─────────────────────────────────────────── */
    .subline {
      font-size: clamp(14px, 1.7vw, 18px);
      font-weight: 400;
      color: var(--text-mid);
      text-align: center;
      letter-spacing: 0.018em;
      line-height: 1.75;
      max-width: 440px;
      margin-bottom: 42px;
      opacity: 0;
      animation: fadeUp 0.9s 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0);    }
    }

    /* ─── CTA ────────────────────────────────────────────── */
    .cta-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      opacity: 0;
      animation: fadeUp 0.9s 1.15s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .btn-start {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 16px 44px;
      background: linear-gradient(135deg, var(--teal-mid), var(--teal-dark));
      color: #fff;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.05em;
      border: none;
      border-radius: 60px;
      cursor: pointer;
      box-shadow: var(--shadow-btn);
      position: relative;
      overflow: hidden;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      text-decoration: none;
    }

    .btn-start::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.16), transparent);
      pointer-events: none;
    }

    .btn-start:hover {
      transform: translateY(-2px) scale(1.025);
      box-shadow: 0 10px 38px rgba(29, 154, 196, 0.40);
    }

    .btn-start:active {
      transform: scale(0.98);
    }

    /* Camera icon inside button */
    .cam-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .cam-icon svg {
      width: 22px;
      height: 22px;
      fill: rgba(255,255,255,0.90);
    }

    /* Privacy note */
    .privacy-note {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-soft);
    }

    .lock-icon {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
    }

    /* ─── TRUST PILLS ────────────────────────────────────── */
    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      justify-content: center;
      margin-top: 28px;
      opacity: 0;
      animation: fadeUp 0.9s 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .pill {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--teal-mid);
      background: rgba(29, 154, 196, 0.08);
      border: 1px solid rgba(29, 154, 196, 0.20);
      border-radius: 30px;
      padding: 6px 16px;
    }

    /* ─── PROGRESS DOTS ──────────────────────────────────── */
/* ── PROGRESS DOTS ───────────────────────────────────── */
    .progress-bar {
      position: fixed;
      bottom: 34px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
      z-index: 20;
      opacity: 0;
      animation: fadeUp 0.9s 1.8s forwards;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(29, 154, 196, 0.28);
      border: none;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
      transition: all 0.38s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .dot.active {
      background: var(--teal-mid);
      width: 22px;
      border-radius: 3px;
    }
  </style>
</head>

<body>

  <!-- ── Background layers ────────────────────────────── -->
  <div class="bg-gradient"></div>
  <div class="bg-dots"></div>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="mirror-line"></div>

  <div class="pulse-ring"></div>
  <div class="pulse-ring"></div>
  <div class="pulse-ring"></div>

  <!-- ── Main stage ───────────────────────────────────── -->
  <main class="stage">

    <!-- Logo -->
    <div class="logo-wrap">
      <img
        class="logo-img"
        src="reflect_logo.png"
        alt="Reflect"
        draggable="false"
      />
    </div>

    <!-- Rotating headlines -->
    <div class="headline-wrap" aria-live="polite"></div>

    <!-- Subline -->
    <p class="subline">
      Your reflection is waiting to listen.<br>
      No sign-up. No data stored. Just&nbsp;you.
    </p>

    <!-- CTA button -->
    <div class="cta-wrap">
      <button class="btn-start" onclick="enterSession()">
        <span class="cam-icon">
          <!-- Camera SVG -->
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M23 7l-7 5 7 5V7z"/>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
          </svg>
        </span>
        Open My Reflection
      </button>

      <span class="privacy-note">
        <!-- Lock SVG -->
        <svg class="lock-icon" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="5.5" width="12" height="7.5" rx="2"
                stroke="#7ca8bb" stroke-width="1.3"/>
          <path d="M4 5.5V4a3 3 0 016 0v1.5"
                stroke="#7ca8bb" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        Private &amp; session-only — nothing is ever saved
      </span>
    </div>

    <!-- Trust pills -->
    <div class="pills">
      <span class="pill">No Sign-Up</span>
      <span class="pill">100% Private</span>
      <span class="pill">Always Free</span>
      <span class="pill">You Matter</span>
    </div>

  </main>

  <!-- ── Progress dots ────────────────────────────────── -->
  <nav class="progress-bar" aria-label="Message progress"></nav>


  <!-- ── JavaScript ───────────────────────────────────── -->
  <script>
    /* ── Headlines list ──────────────────────────────── */
    const HEADLINES = [
      "You are not alone.",
      "Look into your own eyes.\nYou are enough.",
      "Your story isn't over.",
      "The world needs\nexactly you.",
      "You are stronger\nthan this moment.",
      "Talk to the one person\nwho truly knows you.",
      "Stay. The best chapters\nare still unwritten.",
      "You matter more\nthan you know.",
    ];

    const INTERVAL_MS  = 3500;  // time each headline is shown
    const ANIM_OUT_MS  = 500;   // must match CSS hOut duration

    /* ── State ───────────────────────────────────────── */
    let current  = 0;
    let timer    = null;

    /* ── DOM refs ────────────────────────────────────── */
    const wrap = document.querySelector('.headline-wrap');
    const bar  = document.querySelector('.progress-bar');

    /* ── Build progress dots ─────────────────────────── */
    HEADLINES.forEach((_, i) => {
      const d = document.createElement('button');
      d.className = 'dot' + (i === 0 ? ' active' : '');
      d.setAttribute('aria-label', 'Message ' + (i + 1));
      d.addEventListener('click', () => jumpTo(i));
      bar.appendChild(d);
    });

    function setActiveDot(idx) {
      document.querySelectorAll('.dot').forEach((d, i) => {
        d.classList.toggle('active', i === idx);
      });
    }

    /* ── Create a headline element ───────────────────── */
    function makeEl(text) {
      const el = document.createElement('div');
      el.className = 'headline';
      el.textContent = text;
      el.setAttribute('aria-hidden', 'true');
      return el;
    }

    /* ── Show first headline immediately ─────────────── */
    (function showFirst() {
      const el = makeEl(HEADLINES[0]);
      wrap.appendChild(el);
      requestAnimationFrame(() =>
        requestAnimationFrame(() => el.classList.add('enter'))
      );
    })();

    /* ── Cycle to next headline ──────────────────────── */
    function cycle() {
      const nextIdx = (current + 1) % HEADLINES.length;
      transitionTo(nextIdx);
    }

    function transitionTo(nextIdx) {
      /* Remove ALL existing headlines immediately to prevent stacking */
      var allEls = wrap.querySelectorAll('.headline');
      allEls.forEach(function(el) {
        el.classList.remove('enter');
        el.classList.add('leave');
        setTimeout(function() {
          if (el.parentNode) el.parentNode.removeChild(el);
        }, OUT_MS);
      });

      /* Show first headline — short delay so CSS animation is ready */
    setTimeout(function() {
      var el = makeEl(HEADLINES[0]);
      wrap.appendChild(el);
      requestAnimationFrame(function() {
        requestAnimationFrame(function() { el.classList.add('enter'); });
      });
    }, 100);
      }, OUT_MS);

      current = nextIdx;
      setActiveDot(current);
    }

    function jumpTo(idx) {
      if (idx === current) return;
      clearInterval(timer);
      transitionTo(idx);
      timer = setInterval(cycle, INTERVAL_MS);
    }

    /* ── Start auto-cycle ────────────────────────────── */
    timer = setInterval(cycle, INTERVAL_MS);

    /* ── CTA handler ─────────────────────────────────── */
    function enterSession() {
      document.querySelector('.stage').style.transition = 'opacity 0.55s ease';
      document.querySelector('.stage').style.opacity   = '0';
      setTimeout(() => {
        /* ── Replace this alert with your session module ── */
        alert('Opening Reflect session…\n\nConnect your camera/AI module here.');
        document.querySelector('.stage').style.opacity = '1';
      }, 580);
    }
  </script>

</body>
</html>
